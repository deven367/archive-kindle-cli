[project]
name = "archive-kindle-cli"
version = "0.1.0"
description = "Convert archive.today snapshots into Kindle-ready EPUBs"
readme = "README.md"
authors = [
    { name = "deven367", email = "masterdeven@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.12",
    "ebooklib>=0.18",
    "lxml>=5.0",
    "pillow>=10.0",
    "requests>=2.31",
    "typer>=0.12",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
archive-kindle = "archive_kindle_cli.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=archive_kindle_cli --cov-report=term-missing --cov-fail-under=75"

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"
